<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Equipment Information System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#e8ecef;--panel:#fff;--panel2:#f2f5f7;--ink:#18232d;--mu:#5b6976;--line:#d2d9df;--steel:#1b3347;--acc:#1c68a8;--iz:#b93a34;--okc:#25794b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151a;--panel:#171f27;--panel2:#1d2832;--ink:#e3e8ed;--mu:#8e9ca9;--line:#2a3541;--steel:#0a1117;--acc:#5aa6e6}}
:root[data-theme="dark"]{--bg:#0f151a;--panel:#171f27;--panel2:#1d2832;--ink:#e3e8ed;--mu:#8e9ca9;--line:#2a3541;--steel:#0a1117;--acc:#5aa6e6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--steel);color:#fff;border-bottom:3px solid var(--acc)}
.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:6px;background:var(--acc);font-size:20px}
h1{font:600 20px/1.2 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;margin:0;letter-spacing:.01em}.brand p{margin:0;font-size:12.5px;opacity:.75}
main{max-width:1180px;margin:0 auto;padding:18px 24px 40px}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 12px}
button{cursor:pointer;font-weight:500}button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}header button.p{background:var(--acc);border-color:var(--acc)}
button.d{color:var(--iz);border-color:var(--iz);background:transparent}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--mu);padding:10px 16px;margin-bottom:-1px}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font:600 15px "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;color:var(--ink);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 24px}
.f small{display:block;color:var(--mu);font-size:12px}.f b{font-weight:500;word-break:break-word}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:6px;padding:16px 20px;margin-bottom:14px}
.hero.iz{--c:var(--iz)}.hero.ok{--c:var(--okc)}
.tag{font:600 34px/1.1 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.02em}
.sub{display:flex;gap:18px;flex-wrap:wrap;color:var(--mu);margin-top:4px}
.stat{background:var(--c);color:#fff;padding:9px 22px;border-radius:4px;font:600 19px/1.2 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;text-align:center}.stat small{display:block;font:400 12px "IBM Plex Sans",system-ui,sans-serif;opacity:.92}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chips button{padding:3px 10px;font-size:13px;background:var(--panel2)}
.wrap{overflow-x:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 10px;white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--panel2);z-index:1;font-weight:600;color:var(--mu);padding:9px 10px}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 55%,transparent)}tr:hover td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
td input{border:0;background:transparent;padding:5px 4px;min-width:70px;width:100%;border-radius:3px}td input:focus{outline:2px solid var(--acc);background:var(--panel)}td input[readonly]{color:var(--mu)}
.msg{color:var(--mu);margin:6px 0}.hide{display:none}
@media(max-width:600px){header,main{padding-left:14px;padding-right:14px}.tag{font-size:26px}}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:20px;min-width:min(340px,90vw)}dialog::backdrop{background:rgba(0,0,0,.5)}dialog h3{margin:0 0 6px}dialog input{display:block;width:100%;margin:8px 0}#lerr{color:var(--iz);min-height:1.4em;font-size:13px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 12px;resize:vertical}textarea[readonly]{background:var(--panel2)}a.lk{color:var(--acc);text-decoration:underline;cursor:pointer;font-weight:500}
</style></head><body>
<header><div class="brand"><span class="logo">⚡</span><div><h1>Equipment Information System</h1><p>Equipment data and isolation certificates</p></div></div>

 e["Isolation For Dep."]=c.map(x=>x.dept).join(" / ");e["Isolation Certificate Number"]=c.map(x=>x.cert).join(" / ");e["Isolation Date"]=c.map(x=>x.date).join(" / ")}
const saveEq=async e=>{chk(await sb.from("equipment").upsert({tag:e["Tag No."],data:e}))};
const logA=async(action,tag,details)=>{const r=await sb.from("audit_log").insert({action,tag,details});if(r.error)note("Saved, but the activity log failed: "+r.error.message)};
async function load(){const a=await sb.from("equipment").select("data").order("tag").range(0,4999),b=await sb.from("isolation").select("*").range(0,4999);
 if(!chk(a)||!chk(b))return;S.eq=a.data.map(r=>r.data);S.iso=b.data;render();
 if(!S.eq.length)note(editor?"Database is empty. Open Equipment_DB and use Load initial data.":"No data has been loaded yet.")}
function buildNav(){$("nav").innerHTML=[["HOME","HOME"],["DB","Equipment_DB"],["REG","Isolation_Register"],...(editor?[["LOG","Activity log"]]:[]),["ABOUT","About"]].map(([k,l])=>`<button data-t="${k}" class="${k===tab?"on":""}">${l}</button>`).join("")}
function show(t){tab=t;for(const k of["HOME","DB","REG","LOG","ABOUT"])$(k).classList.toggle("hide",k!==t);buildNav();window.scrollTo(0,0);render()}
buildNav();
$("nav").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.t)show(b.dataset.t)};
const GR=[["Equipment details",["Unit","Location In S.S","Type","KW","V","I","Kg","RPM","Th.CL","HZ","IP","Bearing"]],["Isolation",["Isolation For Dep.","Isolation Certificate Number","Isolation Date"]],["Additional data",["Grease","OLR Type","IM Value","COLD","K(6)","HOT","IN","IM"]]];
function home(){
 const q=($("q")?$("q").value:cur).trim().toLowerCase();
 const m=q?S.eq.filter(e=>String(e["Tag No."]).toLowerCase().includes(q)):[];
 if(!eqOf(cur)||(q&&!String(cur).toLowerCase().includes(q)))cur=m[0]?m[0]["Tag No."]:(eqOf(cur)?cur:"");
 const e=eqOf(cur),c=cur?certs(cur):[];
 let h=`<div class="card"><h3>Find equipment</h3><div class="row"><input id="q" placeholder="Tag No., full or partial" value="${E($("q")?$("q").value:cur)}" style="min-width:240px"><button class="d" id="clr">✖ CLEAR</button><span class="msg">${q?m.length+" match(es)":""}</span></div>
 <div class="chips row" style="margin-top:8px">${m.slice(0,15).map(x=>`<button data-tag="${E(x["Tag No."])}">${E(x["Tag No."])}</button>`).join("")}</div></div>`;
 if(!e)h+=`<div class="card msg">${q?"No equipment matches that tag. Try a shorter part of it.":"Search for an equipment tag above to see its details."}</div>`;
 else{
  const iz=e["Isolation Status"]==="Isolated";h+=`<div class="hero ${iz?"iz":"ok"}"><div><div class="tag">${E(e["Tag No."])}</div><div class="sub"><span>Unit ${E(e["Unit"])||"—"}</span><span>${E(e["Location In S.S"])||"—"}</span></div></div><div class="stat">${iz?"Isolated":"Not isolated"}<small>${c.length} certificate${c.length===1?"":"s"}</small></div></div>`;
  for(const[t,ks]of GR)h+=`<div class="card"><h3>${t}</h3><div class="grid">${ks.map(k=>`<div class="f"><small>${k}</small><b>${E(e[k])||"—"}</b></div>`).join("")}</div></div>`;
  h+=`<div class="card"><h3>Remarks</h3><textarea id="rm" rows="4" ${editor?"":"readonly"} placeholder="${editor?"Add remarks about this equipment…":"No remarks."}">${E(e["Remarks"])}</textarea>${editor?`<div class="row" style="margin-top:8px"><button class="p" id="rms">Save remarks</button></div>`:""}</div>`;
  h+=`<div class="card"><h3>Isolation certificates</h3>${editor?`<div class="row"><select id="dp">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select><input id="cn" placeholder="Certificate No."><input id="dt" value="${today()}" placeholder="DD/MM/YYYY" style="width:120px"><button class="p" id="iso">Isolate</button></div>`:`<div class="msg">View only. Sign in as an editor to isolate or de-isolate.</div>`}
  <div class="wrap" style="margin-top:10px"><table><tr><th>Dept</th><th>Certificate No.</th><th>Date</th>${editor?"<th></th>":""}</tr>${c.map(x=>`<tr><td>${E(x.dept)}</td><td>${E(x.cert)}</td><td>${E(x.date)}</td>${editor?`<td><button class="d" data-del="${x.id}">De-isolate Certificate</button></td>`:""}</tr>`).join("")||`<tr><td colspan="4" class="msg">No certificates.</td></tr>`}</table></div></div>`}
 const keep=$("q")&&document.activeElement===$("q"),pos=keep?$("q").selectionStart:0;
 $("HOME").innerHTML=h;const qi=$("q");qi.oninput=home;$("clr").onclick=()=>{cur="";qi.value="";note("");home();$("q").focus()};if(keep){qi.focus();qi.setSelectionRange(pos,pos)}
 $("HOME").querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{cur=b.dataset.tag;qi.value=cur;home()});
 if($("rms"))$("rms").onclick=async()=>{const e=eqOf(cur),old=e["Remarks"]||"",v=$("rm").value;if(v===old)return note("No changes to save.");e["Remarks"]=v;await saveEq(e);await logA("REMARKS",cur,"Remarks updated");note("Remarks saved ✔")};
 if($("iso"))$("iso").onclick=async()=>{const cn=$("cn").value.trim(),dt=$("dt").value.trim();
  if(!cn)return note("Enter the certificate number.");
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dt))return note("Date must be DD/MM/YYYY.");
  const r=await sb.from("isolation").insert({tag:cur,dept:$("dp").value,cert:cn,date:dt}).select().single();if(!chk(r))return;
  S.iso.push(r.data);sync(cur);await saveEq(eqOf(cur));await logA("ISOLATE",cur,$("dp").value+" cert "+cn+" ("+dt+")");note("Isolated ✔");home()};
 $("HOME").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const id=Number(b.dataset.del);
  if(!chk(await sb.from("isolation").delete().eq("id",id)))return;
  const gone=S.iso.find(x=>x.id===id)||{};S.iso=S.iso.filter(x=>x.id!==id);sync(cur);await saveEq(eqOf(cur));await logA("DE-ISOLATE",cur,(gone.dept||"")+" cert "+(gone.cert||"")+" ("+(gone.date||"")+")");home()})}
function dbView(){
 $("DB").innerHTML=`<div class="row" style="margin-bottom:8px"><input id="fl" placeholder="Filter…" value="${E(flt)}">${editor?`<button class="p" id="add">➕ Add equipment</button>${S.eq.length?"":`<button id="seed">Load initial data (${SEED.r.length} equipment)</button>`}`:""}<span class="msg" id="cnt"></span></div><div id="dbt"></div>`;
 $("fl").oninput=ev=>{flt=ev.target.value;dbTable()};
 if($("add"))$("add").onclick=async()=>{const t=(prompt("Tag No. of the new equipment:")||"").trim();if(!t)return;if(eqOf(t))return note("That tag already exists.");
  const e=Object.fromEntries(H.map(h=>[h,h==="Isolation Status"?"Not Isolated":""]));e["Tag No."]=t;S.eq.unshift(e);flt="";await saveEq(e);await logA("ADD EQUIPMENT",t,"New equipment added");dbView()};
 if($("seed"))$("seed").onclick=async()=>{const rows=SEED.r.map(r=>{const o=Object.fromEntries(H.map((h,i)=>[h,r[i]??""]));return{tag:o["Tag No."],data:o}});const seenT={};rows.forEach(x=>{const t=x.tag;let n=1,u=t;while(seenT[u]){n++;u=t+" ("+n+")"}seenT[u]=1;x.tag=u;x.data["Tag No."]=u});
  for(let i=0;i<rows.length;i+=100)if(!chk(await sb.from("equipment").upsert(rows.slice(i,i+100))))return;
  if(SEED.iso.length&&!chk(await sb.from("isolation").insert(SEED.iso)))return;await logA("SEED","","Initial data loaded");load()};
 dbTable()}
function dbTable(){
 const f=flt.toLowerCase(),rows=S.eq.map((e,i)=>[e,i]).filter(([e])=>!f||Object.values(e).some(v=>String(v).toLowerCase().includes(f)));
 $("cnt").textContent=rows.length+" / "+S.eq.length+(editor?" — edit any cell; changes save for everyone.":" — view only.");
 $("dbt").innerHTML=`<div class="wrap"><table><tr>${editor?"<th></th>":""}${H.map(h=>`<th>${E(h)}</th>`).join("")}</tr>${rows.map(([e,i])=>`<tr>${editor?`<td><button class="d" data-r="${i}">✕</button></td>`:""}${H.map(h=>`<td><input data-i="${i}" data-h="${E(h)}" value="${E(e[h])}" ${(!editor||ISOC.includes(h))?"readonly":""}></td>`).join("")}</tr>`).join("")}</table></div>`;
 $("dbt").querySelectorAll("input[data-i]:not([readonly])").forEach(inp=>inp.onchange=async()=>{const e=S.eq[inp.dataset.i],h=inp.dataset.h,old=e[h]??"";if(inp.value===old)return;
  if(h==="Tag No."){const t=inp.value.trim();if(!t||eqOf(t)){inp.value=old;return note("Tag is empty or already exists.")}
   const ne={...e,"Tag No.":t};
   if(!chk(await sb.from("equipment").upsert({tag:t,data:ne})))return;
   if(!chk(await sb.from("isolation").update({tag:t}).eq("tag",old)))return;
   if(!chk(await sb.from("equipment").delete().eq("tag",old)))return;
   S.iso.forEach(c=>{if(c.tag===old)c.tag=t});e["Tag No."]=t;await logA("RENAME TAG",t,'"'+old+'" → "'+t+'"');note("Saved");return}
  e[h]=inp.value;await saveEq(e);await logA("EDIT",e["Tag No."],h+': "'+old+'" → "'+inp.value+'"');note("Saved")});
 $("dbt").querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const e=S.eq[b.dataset.r];if(!confirm("Delete "+e["Tag No."]+" and its certificates?"))return;
  if(!chk(await sb.from("isolation").delete().eq("tag",e["Tag No."])))return;
  if(!chk(await sb.from("equipment").delete().eq("tag",e["Tag No."])))return;
  S.iso=S.iso.filter(c=>c.tag!==e["Tag No."]);S.eq.splice(b.dataset.r,1);await logA("DELETE EQUIPMENT",e["Tag No."],"Equipment and its certificates deleted");dbTable()})}
function table(hs,rows){return`<div class="wrap"><table><tr>${hs.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${E(v)}</td>`).join("")}</tr>`).join("")||`<tr><td class="msg">Empty</td></tr>`}</table></div>`}
const regRows=()=>S.iso.map(c=>{const e=eqOf(c.tag)||{};return[c.tag,e["Unit"]||"",e["Location In S.S"]||"",c.dept,c.cert,c.date,"Isolated"]});
function render(){if(tab==="HOME")home();else if(tab==="DB")dbView();else if(tab==="REG")regView();else if(tab==="LOG")logView();else aboutView()}
function regView(){const rows=regRows();
 $("REG").innerHTML=`<div class="msg">Click a tag to open its details on HOME.</div><div class="wrap"><table><tr>${["Tag No.","Unit","Location","Isolation For Dep.","Certificate No.","Isolation Date","Isolation Status"].map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr><td><a class="lk" href="#" data-go="${E(r[0])}">${E(r[0])}</a></td>${r.slice(1).map(v=>`<td>${E(v)}</td>`).join("")}</tr>`).join("")||`<tr><td class="msg">No isolated equipment.</td></tr>`}</table></div>`;
 $("REG").querySelectorAll("[data-go]").forEach(a=>a.onclick=ev=>{ev.preventDefault();cur=a.dataset.go;if($("q"))$("q").value=cur;show("HOME")})}
async function logView(){
 $("LOG").innerHTML=`<div class="row" style="margin-bottom:8px"><button id="lr">Refresh</button><span class="msg">Last 300 changes made by editors.</span></div><div id="lt" class="msg">Loading…</div>`;
 const run=async()=>{const r=await sb.from("audit_log").select("*").order("at",{ascending:false}).limit(300);if(!chk(r))return;
  $("lt").className="";$("lt").innerHTML=table(["Time","Editor","Action","Tag No.","Details"],r.data.map(x=>[new Date(x.at).toLocaleString(),x.editor,x.action,x.tag||"",x.details||""]))};
 $("lr").onclick=run;run()}
function aboutView(){$("ABOUT").innerHTML=`<div class="card"><h3>About</h3><div class="tag" style="font-size:26px">Ahmed AbdElnaby AbdElhamid</div><div class="sub"><span>Electrical Engineer</span></div>
 <div class="grid" style="margin-top:16px">
 <div class="f"><small>Phone</small><b><a class="lk" href="tel:+201002709143">+0201002709143</a></b></div>
 <div class="f"><small>Phone</small><b><a class="lk" href="tel:+201500081430">+0201500081430</a></b></div>
 <div class="f"><small>Email</small><b><a class="lk" href="mailto:ahmed.a.elnaby96@gmail.com">ahmed.a.elnaby96@gmail.com</a></b></div>
 <div class="f"><small>LinkedIn</small><b><a class="lk" href="https://www.linkedin.com/in/ahmed-abd-elnaby-809270234" target="_blank" rel="noopener">Ahmed Abd Elnaby</a></b></div></div></div>
 <div class="card"><h3>About this system</h3><div class="msg">Search equipment by tag to see its data, isolation status and remarks. Changes are made by authorized editors only.</div></div>`}
function authUI(){$("lg").textContent=editor?"Sign out":"Editor login";$("bi").classList.toggle("hide",!editor);$("bx").classList.toggle("hide",!editor);if(!editor&&tab==="LOG")show("HOME");else buildNav()}
$("lg").onclick=async()=>{if(editor){await sb.auth.signOut();return}$("lerr").textContent="";$("dlg").showModal()};
$("cx").onclick=()=>$("dlg").close();
$("do").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(r.error)return $("lerr").textContent=r.error.message;$("pw").value="";$("dlg").close();note("Signed in as editor")};
$("bx").onclick=()=>{if(!editor)return;if(typeof XLSX==="undefined")return note("Excel library failed to load. Check the connection and reload.");
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.eq,{header:H}),"Equipment_DB");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Tag No.","Unit","Location","Isolation For Dep.","Certificate No.","Isolation Date","Isolation Status"],...regRows()]),"Isolation_Register");
 XLSX.writeFile(wb,"Equipment_System.xlsx");note("Equipment_System.xlsx downloaded.")};
$("bi").onclick=()=>$("fi").click();
$("fi").onchange=async ev=>{const f=ev.target.files[0];if(!f||!editor)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const db=wb.Sheets["Equipment_DB"];if(!db)return note("Sheet Equipment_DB not found.");
  const j=XLSX.utils.sheet_to_json(db,{raw:true,defval:""});
  const eq=j.map(r=>{const o={};for(const k in r)o[k.trim()]=fmtD(r[k]);return Object.fromEntries(H.map(h=>[h,o[h]??""]))}).filter(e=>e["Tag No."]);
  const ds=wb.Sheets["Isolation_Register"]||wb.Sheets["Isolation_Details"];
  const iso=ds?XLSX.utils.sheet_to_json(ds,{raw:true,defval:""}).filter(r=>r["Tag No."]).map(r=>({tag:String(r["Tag No."]),dept:String(r["Isolation For Dep."]),cert:String(r["Certificate No."]),date:fmtD(r["Isolation Date"])})):S.iso.map(({tag,dept,cert,date})=>({tag,dept,cert,date}));
  {const seen={};eq.forEach(e=>{const t=e["Tag No."];let n=1,u=t;while(seen[u]){n++;u=t+" ("+n+")"}seen[u]=1;e["Tag No."]=u})}if(!confirm("Replace the shared data for everyone with "+eq.length+" equipment from this file?"))return;
  S.eq=eq;S.iso=iso;S.eq.forEach(e=>sync(e["Tag No."]));
  if(!chk(await sb.from("isolation").delete().gte("id",0)))return;
  if(!chk(await sb.from("equipment").delete().neq("tag","")))return;
  const rows=S.eq.map(e=>({tag:e["Tag No."],data:e}));
  for(let i=0;i<rows.length;i+=100)if(!chk(await sb.from("equipment").upsert(rows.slice(i,i+100))))return;
  if(iso.length&&!chk(await sb.from("isolation").insert(iso)))return;
  cur="";await logA("IMPORT","",eq.length+" equipment imported from Excel");await load();note("Imported "+eq.length+" equipment ✔")}
 catch(e){note("Import failed: "+e.message)}ev.target.value=""};
if(CFG.url.includes("PASTE")){note("Setup needed: put your Supabase URL and anon key at the top of the script.");$("lg").classList.add("hide")}
else{sb=supabase.createClient(CFG.url,CFG.key);sb.auth.onAuthStateChange((_e,s)=>{editor=!!s;authUI();render()});load()}
render();
</script></body></html>
