<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{--bg:#e8ecef;--panel:#fff;--panel2:#f2f5f7;--ink:#18232d;--mu:#5b6976;--line:#d2d9df;--steel:#1b3347;--acc:#1c68a8;--iz:#b93a34;--okc:#25794b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151a;--panel:#171f27;--panel2:#1d2832;--ink:#e3e8ed;--mu:#8e9ca9;--line:#2a3541;--steel:#0a1117;--acc:#5aa6e6}}
:root[data-theme="dark"]{--bg:#0f151a;--panel:#171f27;--panel2:#1d2832;--ink:#e3e8ed;--mu:#8e9ca9;--line:#2a3541;--steel:#0a1117;--acc:#5aa6e6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--steel);color:#fff;border-bottom:3px solid var(--acc)}
.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:6px;background:var(--acc);font-size:20px}
h1{font:600 20px/1.2 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;margin:0;letter-spacing:.01em}.brand p{margin:0;font-size:12.5px;opacity:.75}
main{max-width:1180px;margin:0 auto;padding:18px 24px 40px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 12px}
button{cursor:pointer;font-weight:500}button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}header button.p{background:var(--acc);border-color:var(--acc)}
button.d{color:var(--iz);border-color:var(--iz);background:transparent}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--mu);padding:10px 16px;margin-bottom:-1px}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font:600 15px "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;color:var(--ink);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 24px}
.f small{display:block;color:var(--mu);font-size:12px}.f b{font-weight:500;word-break:break-word}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:6px;padding:16px 20px;margin-bottom:14px}
.hero.iz{--c:var(--iz)}.hero.ok{--c:var(--okc)}
.tag{font:600 34px/1.1 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.02em}
.sub{display:flex;gap:18px;flex-wrap:wrap;color:var(--mu);margin-top:4px}
.stat{background:var(--c);color:#fff;padding:9px 22px;border-radius:4px;font:600 19px/1.2 "IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;text-align:center}.stat small{display:block;font:400 12px "IBM Plex Sans",system-ui,sans-serif;opacity:.92}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chips button{padding:3px 10px;font-size:13px;background:var(--panel2)}
.wrap{overflow-x:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:4px 10px;white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--panel2);z-index:1;font-weight:600;color:var(--mu);padding:9px 10px}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 55%,transparent)}tr:hover td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
td input{border:0;background:transparent;padding:5px 4px;min-width:70px;width:100%;border-radius:3px}td input:focus{outline:2px solid var(--acc);background:var(--panel)}td input[readonly]{color:var(--mu)}
.msg{color:var(--mu);margin:6px 0}
.rm{border-left:3px solid var(--acc);padding:6px 12px;margin-bottom:8px;background:var(--panel2);border-radius:0 5px 5px 0}
.rd{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--acc)}.rd button{padding:0 8px;font-size:12px}
.rt{white-space:pre-wrap;word-break:break-word;margin-top:2px}
textarea{resize:vertical;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 12px}.hide{display:none}
@media(max-width:600px){header,main{padding-left:14px;padding-right:14px}.tag{font-size:26px}}
</style></head><body>

 [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));render()}
$("nav").innerHTML=[["HOME","HOME"],["DB","Equipment_DB"],["REG","Isolation_Register"]].map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("");
$("nav").onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
const GR=[["Equipment details",["Unit","Location In S.S","Type","KW","V","I","Kg","RPM","Th.CL","HZ","IP","Bearing"]],["Additional data",["Grease","OLR Type","IM Value","COLD","K(6)","HOT","IN","IM"]]];
function home(){
 const q=($("q")?$("q").value:cur).trim().toLowerCase();
 const m=q?S.eq.filter(e=>String(e["Tag No."]).toLowerCase().includes(q)):[];
 if(!eqOf(cur)||(q&&!String(cur).toLowerCase().includes(q)))cur=m[0]?m[0]["Tag No."]:(eqOf(cur)?cur:"");
 const e=eqOf(cur),c=cur?certs(cur):[];
 let h=`<div class="card"><h3>Find equipment</h3><div class="row"><input id="q" placeholder="Tag No., full or partial" value="${E($("q")?$("q").value:cur)}" style="min-width:240px"><button class="d" id="clr">✖ CLEAR</button><span class="msg">${q?m.length+" match(es)":""}</span></div>
 <div class="chips row" style="margin-top:8px">${m.slice(0,15).map(x=>`<button data-tag="${E(x["Tag No."])}">${E(x["Tag No."])}</button>`).join("")}</div></div>`;
 if(!e)h+=`<div class="card msg">${q?"No equipment matches that tag. Try a shorter part of it.":"Search for an equipment tag above to see its details."}</div>`;
 else{
  const iz=e["Isolation Status"]==="Isolated";h+=`<div class="hero ${iz?"iz":"ok"}"><div><div class="tag">${E(e["Tag No."])}</div><div class="sub"><span>Unit ${E(e["Unit"])||"—"}</span><span>${E(e["Location In S.S"])||"—"}</span></div></div><div class="stat">${iz?"Isolated":"Not isolated"}<small>${c.length} certificate${c.length===1?"":"s"}</small></div></div>`;for(const[t,ks]of GR)h+=`<div class="card"><h3>${t}</h3><div class="grid">${ks.map(k=>{let v=e[k]??"";if(k==="Isolation Status")v=`<span class="badge ${v==="Isolated"?"Isolated":"Not"}">${E(v)}</span>`;else v=E(v)||"—";return`<div class="f"><small>${k}</small><b>${v}</b></div>`}).join("")}</div></div>`;
  h+=`<div class="card"><h3>Isolate or de-isolate</h3><div class="row"><select id="dp">${DEPTS.map(d=>`<option>${d}</option>`).join("")}</select><input id="cn" placeholder="Certificate No."><input id="dt" value="${today()}" placeholder="DD/MM/YYYY" style="width:120px"><button class="p" id="iso">Isolate</button></div>
  <div class="wrap" style="margin-top:10px"><table><tr><th>Dept</th><th>Certificate No.</th><th>Date</th><th></th></tr>${c.map(x=>`<tr><td>${E(x.dept)}</td><td>${E(x.cert)}</td><td>${E(x.date)}</td><td><button class="d" data-del="${E(x.cert)}|${E(x.dept)}">De-isolate Certificate</button></td></tr>`).join("")||`<tr><td colspan="4" class="msg">No certificates.</td></tr>`}</table></div></div>`;
  const rm=S.rem.map((r,i)=>({...r,i})).filter(r=>r.tag===cur);
  h+=`<div class="card"><h3>Remarks</h3>${rm.map(r=>`<div class="rm"><div class="rd"><span>${E(r.date)}</span><button class="d" data-rd="${r.i}" title="Delete remark">✕</button></div><div class="rt">${E(r.text)}</div></div>`).join("")||`<div class="msg">No remarks yet.</div>`}
  <div class="row" style="margin-top:10px;align-items:flex-start"><input id="rdt" value="${today()}" placeholder="DD/MM/YYYY" style="width:120px"><textarea id="rtx" rows="2" placeholder="New remark…" style="flex:1;min-width:200px"></textarea><button class="p" id="radd">Add remark</button></div></div>`}
 const keep=$("q")&&document.activeElement===$("q"),pos=keep?$("q").selectionStart:0;
 $("HOME").innerHTML=h;const qi=$("q");qi.oninput=home;$("clr").onclick=()=>{cur="";qi.value="";note("");home();$("q").focus()};if(keep){qi.focus();qi.setSelectionRange(pos,pos)}
 $("HOME").querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{cur=b.dataset.tag;qi.value=cur;home()});
 if($("iso"))$("iso").onclick=()=>{const cn=$("cn").value.trim(),dt=$("dt").value.trim();
  if(!cn)return note("Enter the certificate number.");
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dt))return note("Date must be DD/MM/YYYY.");
  S.iso.push({tag:cur,dept:$("dp").value,cert:cn,date:dt});sync(cur);save();note("Isolated ✔");home()};
 $("HOME").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const[cert,dept]=b.dataset.del.split("|");
  const i=S.iso.findIndex(x=>x.tag===cur&&x.cert===cert&&x.dept===dept);if(i<0)return;S.iso.splice(i,1);sync(cur);save();home()});
 if($("radd"))$("radd").onclick=()=>{const dt=$("rdt").value.trim(),tx=$("rtx").value.trim();
  if(!tx)return note("Write the remark first.");
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dt))return note("Date must be DD/MM/YYYY.");
  S.rem.push({tag:cur,date:dt,text:tx});save();note("Remark added ✔");home()};
 $("HOME").querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{if(!confirm("Delete this remark?"))return;S.rem.splice(+b.dataset.rd,1);save();home()})}
function dbView(){
 const f=flt.toLowerCase(),rows=S.eq.map((e,i)=>[e,i]).filter(([e])=>!f||Object.values(e).some(v=>String(v).toLowerCase().includes(f)));
 $("DB").innerHTML=`<div class="row" style="margin-bottom:8px"><input id="fl" placeholder="Filter…" value="${E(flt)}"><button class="p" id="add">➕ Add equipment</button><span class="msg">${rows.length} / ${S.eq.length} — edit any cell directly; saved automatically.</span></div>
 <div class="wrap"><table><tr><th></th>${H.map(h=>`<th>${E(h)}</th>`).join("")}</tr>${rows.map(([e,i])=>`<tr><td><button class="d" data-r="${i}">✕</button></td>${H.map(h=>`<td><input data-i="${i}" data-h="${E(h)}" value="${E(e[h])}" ${ISOC.includes(h)?"readonly title=\"Managed from HOME\"":""}></td>`).join("")}</tr>`).join("")}</table></div>`;
 $("fl").oninput=ev=>{flt=ev.target.value;dbView();$("fl").focus()};
 $("add").onclick=()=>{S.eq.unshift(Object.fromEntries(H.map(h=>[h,h==="Isolation Status"?"Not Isolated":""])));S.eq[0]["Tag No."]="NEW-TAG";flt="";save();dbView()};
 $("DB").querySelectorAll("input[data-i]").forEach(inp=>inp.onchange=()=>{const e=S.eq[inp.dataset.i],h=inp.dataset.h;
  if(h==="Tag No."){const o=e[h];S.iso.forEach(c=>{if(c.tag===o)c.tag=inp.value});S.rem.forEach(r=>{if(r.tag===o)r.tag=inp.value})}e[h]=inp.value;save()});
 $("DB").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const e=S.eq[b.dataset.r];if(!confirm("Delete "+e["Tag No."]+" and its certificates?"))return;
  S.iso=S.iso.filter(c=>c.tag!==e["Tag No."]);S.rem=S.rem.filter(r=>r.tag!==e["Tag No."]);S.eq.splice(b.dataset.r,1);save();dbView()})}
function table(hs,rows){return`<div class="wrap"><table><tr>${hs.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${E(v)}</td>`).join("")}</tr>`).join("")||`<tr><td class="msg">Empty</td></tr>`}</table></div>`}
const regRows=()=>S.iso.map(c=>{const e=eqOf(c.tag)||{};return[c.tag,e["Unit"]||"",e["Location In S.S"]||"",c.dept,c.cert,c.date,"Isolated"]});
function render(){if(tab==="HOME")home();else if(tab==="DB")dbView();

 else $("REG").innerHTML=table(["Tag No.","Unit","Location","Isolation For Dep.","Certificate No.","Isolation Date","Isolation Status"],regRows())}
$("bx").onclick=async()=>{if(typeof XLSX==="undefined")return note("Excel library failed to load - check your internet connection and reload the page.");note("Preparing Excel file...");
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.eq,{header:H}),"Equipment_DB");

 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Tag No.","Unit","Location","Isolation For Dep.","Certificate No.","Isolation Date","Isolation Status"],...regRows()]),"Isolation_Register");
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Tag No.","Date","Remark"],...S.rem.map(r=>[r.tag,r.date,r.text])]),"Remarks");
 const data=XLSX.write(wb,{bookType:"xlsx",type:"array"});
 try{const d=(typeof claude!=="undefined")?await claude.use("downloads"):null;if(!d){XLSX.writeFile(wb,"Equipment_System.xlsx");return note("Excel file downloaded (Equipment_System.xlsx) - check your Downloads folder.")}
  await d.save({filename:"Equipment_System.xlsx",data});note("Excel file ready — open it, edit, then use Import Excel to load it back.")}
 catch(e){note(e&&e.code==="declined"?"Save cancelled.":"Could not save: "+(e&&e.message||e))}};
$("bi").onclick=()=>$("fi").click();
$("fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const db=wb.Sheets["Equipment_DB"];if(!db)return note("Sheet Equipment_DB not found.");
  const j=XLSX.utils.sheet_to_json(db,{raw:true,defval:""});
  const eq=j.map(r=>{const o={};for(const k in r)o[k.trim()]=fmtD(r[k]);return Object.fromEntries(H.map(h=>[h,o[h]??""]))}).filter(e=>e["Tag No."]);
  const ds=wb.Sheets["Isolation_Register"]||wb.Sheets["Isolation_Details"];
  const iso=ds?XLSX.utils.sheet_to_json(ds,{raw:true,defval:""}).filter(r=>r["Tag No."]).map(r=>({tag:String(r["Tag No."]),dept:String(r["Isolation For Dep."]),cert:String(r["Certificate No."]),date:fmtD(r["Isolation Date"])})):S.iso;
  if(!confirm("Replace current data with "+eq.length+" equipment from this file?"))return;
  const rs=wb.Sheets["Remarks"];const rem=rs?XLSX.utils.sheet_to_json(rs,{raw:true,defval:""}).filter(r=>r["Tag No."]&&r["Remark"]).map(r=>({tag:String(r["Tag No."]),date:fmtD(r["Date"]),text:String(r["Remark"])})):S.rem;S={eq,iso,rem};S.eq.forEach(e=>sync(e["Tag No."]));save();cur="";note("Imported "+eq.length+" equipment ✔");render()}
 catch(e){note("Import failed: "+e.message)}ev.target.value=""};
render();
</script></body></html>
